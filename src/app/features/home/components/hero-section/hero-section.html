<section class="hero">
  <div class="container hero__container">
    <!-- ========================= -->
    <!-- Left Content              -->
    <!-- ========================= -->

    <div class="hero__content">
      <span class="hero__badge"> Learn & Get Certificates </span>

      <h1 class="hero__title">Free Online Courses With Certificates & Diplomas</h1>

      <p class="hero__subtitle">25 Million Learners. 15 Years. 100% Online.</p>

      <form class="hero__search">
        <input class="hero__search-input" type="text" placeholder="What do you want to learn today?" />

        <button class="hero__search-button" type="submit">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20L16.65 16.65"></path>
          </svg>
        </button>
      </form>
    </div>

    <!-- ========================= -->
    <!-- Right Images              -->
    <!-- ========================= -->

    <div class="hero__visual">
      <div class="hero__student hero__student--small">
        <img
          class="hero__student-image"
          src="/assets/images/home/hero-section/images/happy-student-with-notebooks.webp"
          alt="Student"
        />
      </div>

      <div class="hero__student hero__student--large">
        <img
          class="hero__student-image"
          src="/assets/images/home/hero-section/images/student-success-character.webp"
          alt="Student"
        />
      </div>

      <!-- Floating Card -->

      <div class="hero__card hero__card--top">
        <h4 class="hero__card-title">2k+</h4>
        <span class="hero__card-subtitle">Student</span>
      </div>

      <div class="hero__card hero__card--bottom">
        <h4 class="hero__card-title">5.8k</h4>
        <span class="hero__card-subtitle">Success Courses</span>
      </div>

      <!-- Decorative Dots -->

      <span class="hero__dot hero__dot--one"></span>
      <span class="hero__dot hero__dot--two"></span>
      <span class="hero__dot hero__dot--three"></span>
    </div>
  </div>
</section>
