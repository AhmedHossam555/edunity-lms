<!-- ========================================= -->
<!-- Features Section                          -->
<!-- ========================================= -->
<section class="features section-padding">
  <div class="container">
    <!-- ========================================= -->
    <!-- Section Header                            -->
    <!-- ========================================= -->
    <div class="features__header">
      <span class="features__subtitle">
        <app-section-tag-header [text]="config().subtitleText" [hasIcon]="true" />
      </span>

      <h2 class="features__title">
        {{ config().titleLine1 }}
        <br />
        {{ config().titleLine2 }}
      </h2>
    </div>

    <!-- ========================================= -->
    <!-- Features Grid                             -->
    <!-- ========================================= -->
    <div class="features__grid">
      @for (item of cards(); track trackById($index, item)) {
        <!-- ========================================= -->
        <!-- Feature Card                              -->
        <!-- ========================================= -->
        <article class="features__card">
          <div class="features__card-icon" [innerHTML]="item.icon"></div>

          <h3 class="features__card-title">
            {{ item.title }}
          </h3>

          <p class="features__card-description">
            {{ item.description }}
          </p>

          <app-button [text]="item.buttonText" />
        </article>
      }
    </div>
  </div>
</section>
