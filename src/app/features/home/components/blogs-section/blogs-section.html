<section class="blogs section-padding">
  <div class="container">
    <!-- ========================================= -->
    <!-- Header                                    -->
    <!-- ========================================= -->
    <div class="blogs__header">
      <div class="blogs__heading">
        <span class="blogs__subtitle">
          <span class="blogs__subtitle-icon" [innerHTML]="subtitleIcon"></span>
          <span class="blogs__subtitle-text">{{ copy.subtitle }}</span>
        </span>

        <h2 class="blogs__title">{{ copy.title }}</h2>
      </div>

      <app-button [text]="buttonLabel.AllBlogPost"></app-button>
    </div>

    <!-- ========================================= -->
    <!-- Blog Cards                                -->
    <!-- ========================================= -->
    <div class="blogs__grid">
      @for (card of blogCards(); track card.id) {

        <!-- ========================================= -->
        <!-- Blog Card                                 -->
        <!-- ========================================= -->
        <article class="blogs__card">
          <img
            [src]="card.imageSrc"
            [alt]="card.imageAlt"
            class="blogs__image"
          />

          <div class="blogs__content">

            <!-- ========================================= -->
            <!-- Card Meta                                 -->
            <!-- ========================================= -->
            <div class="blogs__meta">
              <span class="blogs__meta-item">
                <span class="blogs__meta-icon" [innerHTML]="dateIcon"></span>
                <span class="blogs__meta-text">{{ card.publishedDate }}</span>
              </span>

              <span class="blogs__meta-item">
                <span class="blogs__meta-icon" [innerHTML]="commentIcon"></span>
                <span class="blogs__meta-text">{{ formatCommentLabel(card.commentCount) }}</span>
              </span>
            </div>

            <!-- ========================================= -->
            <!-- Card Title                                -->
            <!-- ========================================= -->
            <h3 class="blogs__card-title">{{ card.title }}</h3>

            <!-- ========================================= -->
            <!-- Card Action                               -->
            <!-- ========================================= -->
            <app-button [text]="buttonLabel.ReadMore"></app-button>

          </div>
        </article>
      }
    </div>
  </div>
</section>
