<section class="stats section-padding">
  <div class="container stats__container">
    <!-- Left Content -->
    <div class="stats__content">
      <span class="stats__subtitle">
        <span [innerHTML]="subtitleIcon"></span>
        {{ content().subtitle }}
      </span>

      <h2 class="stats__title">
        {{ content().title }}
        <span>{{ content().titleHighlight }}</span>
        {{ content().titleSuffix }}
      </h2>

      <p class="stats__description">
        {{ content().description }}
      </p>

      <div class="stats__progress-list">
        @for (item of progressList(); track trackByProgressKey($index, item)) {
          <div class="stats__progress">
            <div class="stats__progress-header">
              <span class="stats__progress-label">{{ item.label }}</span>
              <span class="stats__progress-value">{{ item.value }}%</span>
            </div>

            <div class="stats__progress-bar">
              <span
                class="stats__progress-fill"
                [style.width.%]="item.value"
              ></span>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Right Image -->
    <div class="stats__image-wrapper">
      <div class="stats__image-frame"></div>

      <img
        class="stats__image"
        [src]="content().image.src"
        [alt]="content().image.alt"
        loading="lazy"
      />
    </div>
  </div>
</section>
