<section class="featured-courses section-padding">
  <div class="container">

    <!-- Header -->
    <div class="featured-courses__header">
      <div class="featured-courses__heading">
        <span class="featured-courses__subtitle">
          Top Popular Course
        </span>

        <h2 class="featured-courses__title">
          Check Out Educate Features <br />
          Win Any Exam
        </h2>
      </div>

      <app-button
        [text]="'Browse Eduinity Courses'">
      </app-button>
    </div>

    <!-- Cards -->
    <div class="featured-courses__grid">

      <article class="featured-courses__card">

        <div class="featured-courses__image-wrapper">
          <img
            class="featured-courses__image"
            src=""
            alt="Course">

          <span class="featured-courses__badge">
            Development
          </span>
        </div>

        <div class="featured-courses__content">

          <div class="featured-courses__rating">
            ★★★★★
            <span>(4.7)</span>
          </div>

          <h3 class="featured-courses__course-title">
            IT Statistics Data Science And Business Analysis
          </h3>

          <div class="featured-courses__meta">

            <div class="featured-courses__meta-item">
              <i></i>
              Lesson 10
            </div>

            <div class="featured-courses__meta-item">
              <i></i>
              19h 30m
            </div>

            <div class="featured-courses__meta-item">
              <i></i>
              Students 20+
            </div>

          </div>

          <div class="featured-courses__divider"></div>

          <div class="featured-courses__footer">

            <div class="featured-courses__author">
              <img
                class="featured-courses__avatar"
                src=""
                alt="Angela">

              <span>
                By <strong>Angela</strong> in Development
              </span>
            </div>

            <div class="featured-courses__price">
              <span class="featured-courses__price-current">
                $60
              </span>

              <span class="featured-courses__price-old">
                $120
              </span>
            </div>

            <button class="featured-courses__cart">
              Add To Cart
            </button>

          </div>

        </div>

      </article>

    </div>

  </div>
</section>
