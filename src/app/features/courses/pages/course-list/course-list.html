<app-page-banner [title]="'Courses'" [currentPage]="'Courses'" />

<main class="section-padding">
  <div class="container">
    <!-- ========================================= -->
    <!-- Loading State                             -->
    <!-- ========================================= -->
    @if (facade.loading()) {
      <!-- ========================================= -->
      <!-- Search Skeleton                           -->
      <!-- ========================================= -->
      <app-course-search-skeleton />

      <!-- ========================================= -->
      <!-- Filter Skeleton                           -->
      <!-- ========================================= -->
      <app-course-filter-skeleton />

      <!-- ========================================= -->
      <!-- Course Skeleton Grid                      -->
      <!-- ========================================= -->
      <section class="course-list">
        @for (item of [1, 2, 3, 4, 5, 6]; track $index) {
          <app-course-skeleton />
        }
      </section>
    } @else if (facade.error()) {
      <app-error-state
        title="Something went wrong"
        description="We couldn't load the courses. Please try again."
        buttonText="Retry"
        (retry)="retry()"
      />
    }
    <!-- ========================================= -->
    <!-- Courses Content                            -->
    <!-- ========================================= -->
    @else if (facade.filteredCourses().length) {
      <!-- ========================================= -->
      <!-- Search and Filter                         -->
      <!-- ========================================= -->
      <app-course-search />
      <app-course-filter />

      <!-- ========================================= -->
      <!-- Course Grid                               -->
      <!-- ========================================= -->
      <section class="course-list" aria-labelledby="courses-heading">
        @for (course of facade.paginatedCourses(); track course.id) {
          <app-course-card [course]="course" />
        }
      </section>

      <!-- ========================================= -->
      <!-- Pagination                                -->
      <!-- ========================================= -->
      @if (facade.totalItems() > facade.itemsPerPage()) {
        <div class="pagination-wrapper">
          <app-pagination
            [currentPage]="facade.currentPage()"
            [totalItems]="facade.totalItems()"
            [itemsPerPage]="facade.itemsPerPage()"
            [totalPages]="facade.totalPages()"
            [maxVisiblePages]="5"
            [showFirstLast]="true"
            [showPrevNext]="true"
            [showPageSize]="false"
            [showSummary]="false"
            [pageSizeOptions]="[3, 6, 9, 12, 24]"
            [disabled]="facade.loading()"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)"
          />
        </div>
      }
    }

    <!-- ========================================= -->
    <!-- Empty State                                -->
    <!-- ========================================= -->
    @else {
      <app-empty-state
        [title]="getEmptyStateTitle()"
        [description]="getEmptyStateDescription()"
        [buttonText]="getEmptyStateButtonText()"
        (action)="handleEmptyStateAction()"
      />
    }
  </div>
</main>
