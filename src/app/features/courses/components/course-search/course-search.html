<div class="search-container">
  <div class="search-wrapper">
    <i class="search-icon">🔍</i>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onSearchInput($event)"
      placeholder="Search courses..."
      class="search-input"
      aria-label="Search courses"
    />
    @if (searchTerm()) {
      <button 
        class="clear-button" 
        (click)="clearSearch()"
        aria-label="Clear search"
        type="button"
      >
        ✕
      </button>
    }
  </div>
</div>
