<!-- ========================================= -->
<!-- Contact Map                               -->
<!-- ========================================= -->
<section
  class="contact-map"
  role="region"
  aria-labelledby="contact-map-title">

  <!-- ========================================= -->
  <!-- Hidden Section Title (Accessibility)      -->
  <!-- ========================================= -->
  <h2 id="contact-map-title" class="contact-map__title sr-only">
    Office location
  </h2>

  <!-- ========================================= -->
  <!-- Google Maps Embed                         -->
  <!-- ========================================= -->
  @if (safeUrl()) {
    <iframe
      class="contact-map__frame"
      [src]="safeUrl()"
      title="Company office location on Google Maps"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>
  }
</section>
