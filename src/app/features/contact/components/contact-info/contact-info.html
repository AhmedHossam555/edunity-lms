<div class="contact-info" role="region" aria-labelledby="contact-heading">
  <h2 id="contact-heading" class="contact-info__title">Contact Information</h2>

  <!-- ========================================= -->
  <!-- Address                                   -->
  <!-- ========================================= -->
  <address class="contact-info__item">
    <div class="contact-info__icon-wrapper" aria-hidden="true">
      <span class="contact-info__icon" [innerHTML]="addressIconSafe"></span>
    </div>
    <div class="contact-info__content">
      <span class="contact-info__label">Address</span>
      <p class="contact-info__value">{{ config().address }}</p>
    </div>
  </address>

  <!-- ========================================= -->
  <!-- Phone                                     -->
  <!-- ========================================= -->
  <div class="contact-info__item">
    <div class="contact-info__icon-wrapper" aria-hidden="true">
      <span class="contact-info__icon" [innerHTML]="phoneIconSafe"></span>
    </div>
    <div class="contact-info__content">
      <span class="contact-info__label">Phone</span>
      <a
        class="contact-info__link"
        [href]="'tel:' + config().phone"
        [attr.aria-label]="'Call us at ' + config().phone">
        {{ config().phone }}
      </a>
    </div>
  </div>

  <!-- ========================================= -->
  <!-- Email                                     -->
  <!-- ========================================= -->
  <div class="contact-info__item">
    <div class="contact-info__icon-wrapper" aria-hidden="true">
      <span class="contact-info__icon" [innerHTML]="emailIconSafe"></span>
    </div>
    <div class="contact-info__content">
      <span class="contact-info__label">Email</span>
      <a
        class="contact-info__link"
        [href]="'mailto:' + config().email"
        [attr.aria-label]="'Email us at ' + config().email">
        {{ config().email }}
      </a>
    </div>
  </div>

  <!-- ========================================= -->
  <!-- Social Links                              -->
  <!-- ========================================= -->
  <div class="contact-info__social">
    <h3 class="contact-info__social-title">Follow Us</h3>

    <!-- ========================================= -->
    <!-- Social Icons                              -->
    <!-- ========================================= -->
    <div class="contact-info__social-icons" role="list">
      @for (social of socials(); track social.url) {
        <a
          class="contact-info__social-link contact-info__social-link--{{ social.label.toLowerCase() }}"
          [href]="social.url"
          [attr.aria-label]="'Follow us on ' + social.label"
          target="_blank"
          rel="noopener noreferrer"
          role="listitem">
          <span
            class="contact-info__social-icon"
            [innerHTML]="getSocialSvgSafe(social.icon)"
            aria-hidden="true"></span>
          <span class="contact-info__social-text visually-hidden">
            {{ social.label }}
          </span>
        </a>
      }
    </div>
  </div>
</div>
