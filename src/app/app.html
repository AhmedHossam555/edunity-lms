@switch (appState()) {

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Application Ready                                             -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @case (APP_STATE.READY) {
    <h1 class="container">
      HELLO
    </h1>
    <router-outlet />
  }

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Offline State                                                 -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @case (APP_STATE.OFFLINE) {
    <app-network-status-banner />
  }

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Default State                                                 -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @default {
    <h1>Loading...</h1>
  }

}
