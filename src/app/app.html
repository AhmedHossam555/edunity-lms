@switch (appState()) {
  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Application Ready                                             -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @case (APP_STATE.READY) {
    <app-main-site-header />
    <router-outlet />
    <app-main-site-footer />
    <app-scroll-to-top/>
  }

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Offline State                                                 -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @case (APP_STATE.OFFLINE) {
    <app-network-status-banner />
  }

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- Default State                                                 -->
  <!-- ───────────────────────────────────────────────────────────── -->

  @default {
    <h1>Loading...</h1>
  }
}
