<article
  class="toast__item"
  [class]="modifierClass()"
  [attr.role]="role()"
  [attr.aria-live]="ariaLive()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <span class="toast__icon" [innerHTML]="iconHtml()"></span>

  <div class="toast__body">
    <p class="toast__title">{{ toast().title }}</p>
    <p class="toast__message">{{ toast().message }}</p>
  </div>

  @if (toast().closable) {
    <button
      type="button"
      class="toast__close"
      aria-label="Close notification"
      (click)="close()"
    >
      <span class="toast__close-icon" [innerHTML]="closeIconHtml"></span>
    </button>
  }

  @if (toast().duration > 0) {
    <span
      class="toast__progress"
      [style.animation-duration.ms]="progressDurationMs()"
      aria-hidden="true"
    ></span>
  }
</article>
