<header class="header">
  <!-- ========================================= -->
  <!-- Top Bar                                   -->
  <!-- ========================================= -->

  <div class="header__top-bar">
    <div class="header__top-bar-container container">
      <div class="header__top-bar-left">
        @for (item of config().topBar.infoItems; track item.id) {
          <div class="header__top-bar-info-item">
            <span
              class="header__top-bar-icon"
              aria-hidden="true"
              [innerHTML]="topBarIconsSafe()[item.iconKey]"
            ></span>
            <span class="header__top-bar-info-label">{{ item.label }}</span>
          </div>
        }
      </div>

      <div class="header__top-bar-right">
        <a
          class="header__top-bar-login"
          [href]="config().topBar.loginLink.href"
          [attr.aria-label]="config().topBar.loginLink.label"
        >
          <span class="header__top-bar-icon" aria-hidden="true" [innerHTML]="loginIconSafe()"></span>
          <span class="header__top-bar-login-label">{{ config().topBar.loginLink.label }}</span>
        </a>

        <div class="header__top-bar-socials">
          @for (social of config().topBar.socials; track social.platform) {
            <a 
              class="header__top-bar-social-link"
              [href]="social.href" 
              [attr.aria-label]="social.ariaLabel"
            >
              <span
                class="header__top-bar-social-icon"
                aria-hidden="true"
                [innerHTML]="socialIconsSafe()[social.platform]"
              ></span>
            </a>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================= -->
  <!-- Navigation                                -->
  <!-- ========================================= -->

  <nav class="header__navbar" aria-label="Main navigation">
    <div class="header__navbar-container container">
      <a class="header__navbar-logo" [href]="config().logo.href">
        <img
          class="header__navbar-logo-image"
          [src]="config().logo.src"
          [alt]="config().logo.alt"
          [height]="config().logo.height"
          [width]="config().logo.width"
        />
      </a>

      <ul class="header__navbar-menu" [class.header__navbar-menu--open]="isMobileMenuOpen()">
        @for (link of navLinks(); track trackByLinkId($index, link)) {
          <li class="header__navbar-menu-item">
            <a
              class="header__navbar-link"
              [class.header__navbar-link--active]="isActiveLink(link.id)"
              [href]="link.href"
              [attr.aria-current]="isActiveLink(link.id) ? 'page' : null"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="header__navbar-actions">
        <button
          type="button"
          class="header__navbar-search-btn"
          aria-label="Open search"
        >
          <span class="header__navbar-search-icon" aria-hidden="true" [innerHTML]="searchIconSafe()"></span>
        </button>

        <button
          type="button"
          class="header__navbar-menu-toggle"
          [attr.aria-expanded]="isMobileMenuOpen()"
          aria-controls="navbar-menu"
          aria-label="Toggle navigation menu"
          (click)="toggleMobileMenu()"
        >
          <span class="header__navbar-menu-toggle-bar"></span>
          <span class="header__navbar-menu-toggle-bar"></span>
          <span class="header__navbar-menu-toggle-bar"></span>
        </button>

        <button type="button" class="header__navbar-contact-btn">
          <span class="header__navbar-contact-label">{{ config().navbar.contactButton.label }}</span>
          <span class="header__navbar-contact-arrow" aria-hidden="true" [innerHTML]="arrowIconSafe()"></span>
        </button>
      </div>
    </div>
  </nav>
</header>
